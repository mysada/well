    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        # Define the root directory for your Laravel application
        root /var/www/html/public;
        index index.php index.html index.htm;

        # Server name (adjust if needed, or use a wildcard)
        server_name _;

        # Prevent access to hidden files
        location ~ /\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM configuration
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            # Use the PHP-FPM service name and port
            # 'php-fpm' is often the hostname if running in a separate container,
            # but here it's on localhost as it's in the same container managed by Supervisor.
            fastcgi_pass 127.0.0.1:9000; # PHP-FPM listens on port 9000 by default
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            include fastcgi_params;
        }

        # Cache control for static assets (images, CSS, JS)
        location ~* \.(?:jpg|jpeg|gif|png|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 7d; # Cache for 7 days
            add_header Cache-Control "public";
            access_log off;
        }

        # Gzip compression (optional but recommended)
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_buffers 16 8k;
        gzip_http_version 1.1;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    }
