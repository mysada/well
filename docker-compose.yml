version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args: # Build arguments can also differ per environment if needed
        APP_ENV: ${APP_ENV:-development} # Default to development if not set
    container_name: well-project-app
    restart: unless-stopped
    tty: true
    # Environment variables can be set here as defaults
    # or entirely within the env_file specified by override files
    volumes:
      - .:/var/www/html # Good for dev, consider removing for prod build image
      # If storage/bootstrap/cache are not part of the main volume, define them separately:
      # - well_storage:/var/www/html/storage
      # - well_bootstrap_cache:/var/www/html/bootstrap/cache
    ports:
      - "${APP_PORT:-8000}:80" # Use an env var for the host port too
    networks:
      - wellnet

networks:
  wellnet:
    driver: bridge

# volumes: # Define if using named volumes for storage
#   well_storage:
#   well_bootstrap_cache: