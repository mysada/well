version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: paracide/well
    ports:
      - "80:80"
    volumes:
      - storage_data:/var/www/html/storage  # 仅挂载 storage 目录
    environment:
      APP_ENV: production
      APP_DEBUG: false
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: mydasa
      DB_USERNAME: mydasa
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - mysql

  mysql:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: mydasa
      MYSQL_USER: mydasa
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
  storage_data:
